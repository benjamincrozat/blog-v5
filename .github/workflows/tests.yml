name: Run tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: true
      matrix:
        php: [8.4, 8.5]
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: blog_v5_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: blog_v5_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: ${{ matrix.php }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24

      - name: Create .env file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate encryption key
        run: php artisan key:generate

      - name: Install frontend dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
        run: npm ci

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Run static analysis
        run: php vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run tests
        run: php artisan test --parallel

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: laravel-log-php-${{ matrix.php }}
          path: storage/logs/laravel.log

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Deploy on production
        env:
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
        run: |
          test -n "$DEPLOYMENT_URL"
          printf 'url = "%s"\nrequest = "POST"\nretry = 2\n' "$DEPLOYMENT_URL" \
            | curl --fail --silent --show-error --config -

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
