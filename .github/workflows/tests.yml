name: Run tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb # 8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: blog_v5_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: blog_v5_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          coverage: none
          php-version: '8.5'

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-scripts --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          composer audit --locked --no-interaction
          npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

      - name: Run static analysis
        run: php vendor/bin/phpstan analyse --memory-limit=2G

      - name: Run tests
        run: php artisan test --parallel

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Deploy on production
        env:
          DEPLOYMENT_URL: ${{ secrets.DEPLOYMENT_URL }}
        run: |
          test -n "$DEPLOYMENT_URL"
          printf 'url = "%s"\nrequest = "POST"\nretry = 2\n' "$DEPLOYMENT_URL" \
            | curl --fail --silent --show-error --config -

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
